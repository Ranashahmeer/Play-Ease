<div class="ai-assistant-wrapper">
    <!-- Floating Chat Button -->
    <button class="chat-fab" (click)="toggleChat()" [class.active]="isOpen" *ngIf="!isOpen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="ai-badge">AI</span>
    </button>

    <!-- Chat Panel -->
    <div class="chat-panel" [class.open]="isOpen">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-content">
                <div class="ai-avatar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    </svg>
                </div>
                <div class="header-text">
                    <h3>AI Assistant</h3>
                    <span class="status">Online • Ready to help</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" (click)="clearChat()" title="Clear chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="1 4 1 10 7 10"></polyline>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                </button>
                <button class="icon-btn close-btn" (click)="toggleChat()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="messages-container" #messagesContainer>
            <div class="messages-inner">
                <!-- Message Bubbles -->
                <div *ngFor="let msg of messages" class="message-wrapper" [class.user-message]="msg.sender === 'user'"
                    [class.ai-message]="msg.sender === 'ai'">
                    <div class="message-bubble">
                        <div class="message-text" [innerHTML]="msg.message"></div>
                        <div class="message-time">{{ msg.timestamp | date:'shortTime' }}</div>

                        <!-- Court Cards (if applicable) -->
                        <div class="court-cards" *ngIf="msg.courts && msg.courts.length > 0">
                            <div class="court-card" *ngFor="let court of msg.courts">
                                <div class="court-info">
                                    <h4>{{ court.name }}</h4>
                                    <div class="court-details">
                                        <span class="location">📍 {{ court.location }}</span>
                                        <span class="sport">{{ court.sport }}</span>
                                    </div>
                                    <div class="court-meta">
                                        <span class="price">Rs. {{ court.pricePerHour }}/hr</span>
                                        <span class="rating">⭐ {{ court.rating }}</span>
                                    </div>
                                </div>
                                <button class="view-btn" (click)="viewCourt(court.courtId)">
                                    View Details
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Typing Indicator -->
                <div class="message-wrapper ai-message" *ngIf="isTyping">
                    <div class="message-bubble typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <!-- Suggestions -->
            <div class="suggestions" *ngIf="showSuggestions && messages.length <= 1">
                <p class="suggestions-title">Try asking:</p>
                <div class="suggestion-pills">
                    <button class="suggestion-pill" *ngFor="let suggestion of suggestions"
                        (click)="useSuggestion(suggestion)">
                        {{ suggestion }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <textarea [(ngModel)]="currentMessage" placeholder="Type your message..." rows="1"
                    (keypress)="onKeyPress($event)" [disabled]="isTyping" class="chat-input"></textarea>
                <button class="send-btn" (click)="sendMessage()" [disabled]="!currentMessage.trim() || isTyping">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="input-hint">Press Enter to send • Shift+Enter for new line</div>
        </div>
    </div>
</div>
