<div class="notification-bell-container">
  <button class="notification-bell-btn" (click)="toggleDropdown()"
    [attr.aria-label]="'Notifications' + (unreadCount > 0 ? ' (' + unreadCount + ' unread)' : '')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
    </svg>
    <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
  </button>

  <div class="notification-dropdown" [class.active]="showDropdown" *ngIf="showDropdown">
    <div class="dropdown-header">
      <h3>Notifications</h3>
      <div class="header-actions">
        <button class="btn-mark-all-read" *ngIf="unreadCount > 0" (click)="markAllAsRead()">
          Mark all as read
        </button>
        <button class="btn-close-dropdown" (click)="toggleDropdown()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="dropdown-content">
      <div class="loading-notifications" *ngIf="isLoading">
        <p>Loading notifications...</p>
      </div>

      <div class="no-notifications" *ngIf="!isLoading && notifications.length === 0">
        <p>No notifications</p>
      </div>

      <div class="notifications-list" *ngIf="!isLoading && notifications.length > 0">
        <div class="notification-item" *ngFor="let notification of notifications" [class.unread]="!notification.isRead"
          [class]="getNotificationClass(notification.type)" (click)="markAsRead(notification)">
          <div class="notification-icon" [ngClass]="getIconClass(notification.type)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <ng-container [ngSwitch]="notification.type">
                <!-- Match Cancelled / Error -->
                <ng-container *ngSwitchCase="'match_cancelled'">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="15" y1="9" x2="9" y2="15"></line>
                  <line x1="9" y1="9" x2="15" y2="15"></line>
                </ng-container>
                <ng-container *ngSwitchCase="'error'">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="15" y1="9" x2="9" y2="15"></line>
                  <line x1="9" y1="9" x2="15" y2="15"></line>
                </ng-container>

                <!-- Application Accepted / Success -->
                <ng-container *ngSwitchCase="'application_accepted'">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </ng-container>
                <ng-container *ngSwitchCase="'success'">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </ng-container>

                <!-- Application Rejected / Warning -->
                <ng-container *ngSwitchCase="'application_rejected'">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                  </path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </ng-container>
                <ng-container *ngSwitchCase="'warning'">
                  <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                  </path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </ng-container>

                <!-- Application Withdrawn -->
                <ng-container *ngSwitchCase="'application_withdrawn'">
                  <line x1="19" y1="12" x2="5" y2="12"></line>
                  <polyline points="12 19 5 12 12 5"></polyline>
                </ng-container>

                <!-- New Applicant -->
                <ng-container *ngSwitchCase="'new_applicant'">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </ng-container>

                <!-- Match Reminder -->
                <ng-container *ngSwitchCase="'match_reminder'">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </ng-container>

                <!-- Default Info -->
                <ng-container *ngSwitchDefault>
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="16" x2="12" y2="12"></line>
                  <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </ng-container>
              </ng-container>
            </svg>
          </div>
          <div class="notification-content">
            <div class="notification-title">{{ notification.title }}</div>
            <div class="notification-message">{{ notification.message }}</div>
            <div class="notification-time">{{ formatDate(notification.createdAt) }}</div>
          </div>
          <button class="btn-delete-notification" (click)="deleteNotification(notification, $event)"
            title="Delete notification">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
